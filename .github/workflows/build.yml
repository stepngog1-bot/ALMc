name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Almas Sales v1.16
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Check project files
        run: |
          echo "Project root:"
          ls -la
          echo "App folder:"
          ls -la app || true

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Show generated APK files
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare final APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "Release APK not found"
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" output/Almas-Sales-v1.16.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Almas-Sales-v1.16
          path: output/Almas-Sales-v1.16.apk
          if-no-files-found: error
          retention-days: 30
