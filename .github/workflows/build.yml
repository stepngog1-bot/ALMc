name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Almas Sales v1.16
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -maxdepth 4 -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/keystore.properties"
          test -f "$PROJECT_DIR/almas-release.jks"

          echo "Required project and signing files are present."
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "Installed Android platforms:"
          ls "$ANDROID_HOME/platforms" || true

          echo "Installed Build Tools:"
          ls "$ANDROID_HOME/build-tools" || true

          gradle --version

      - name: Build signed Release APK
        shell: bash
        run: |
          set -e

          gradle \
            -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Find generated APK
        shell: bash
        run: |
          echo "Generated files:"
          find "$PROJECT_DIR/app/build/outputs" -type f | sort || true

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            ! -name "*unsigned*" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Signed Release APK was not found."
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" \
            output/Almas-Sales-v1.16.apk

          echo "Final APK:"
          ls -lh output/Almas-Sales-v1.16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almas-Sales-v1.16
          path: output/Almas-Sales-v1.16.apk
          if-no-files-found: error
          retention-days: 30
