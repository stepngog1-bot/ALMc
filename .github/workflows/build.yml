name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Almas Sales v1.16
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -maxdepth 4 -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify required files
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/keystore.properties"
          test -f "$PROJECT_DIR/almas-release.jks"

          echo "Required project and signing files are present."

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          gradle --version

      - name: Build signed Release APK
        shell: bash
        run: |
          set -e

          gradle \
            -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            ! -name '*unsigned*' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "Signed release APK not found"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null | sort || true
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" \
            output/Almas-Sales-v1.16.apk

          ls -lh output/Almas-Sales-v1.16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almas-Sales-v1.16
          path: output/Almas-Sales-v1.16.apk
          if-no-files-found: error
          retention-days: 30
